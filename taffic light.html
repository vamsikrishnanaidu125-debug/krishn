<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
body{
    margin:0;
    text-align:center;
    font-family:Georgia, serif;
    background:white;
}

.signal-box{
    width:200px;
    height:400px;
    background:#111;
    margin:50px auto 0;
    border-radius:15px;
    padding-top:10px;
    box-sizing:border-box;
}

.red,
.yellow,
.green{
    width:100px;
    height:100px;
    border-radius:50%;
    margin:0 auto 10px;
    color:white;
    font-size:12px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.red{
    background:red;
}

.yellow{
    background:orange;
}

.green{
    background:green;
}

.pole{
    width:18px;
    height:120px;
    background:black;
    margin:auto;
}

h1{
    font-size:50px;
    margin-top:20px;
    color:#001f4d;
}

p{
    font-size:22px;
}
</style>

</head>
<body>

<div class="signal-box">

    <div class="red">
        STOP<br>PROCRASITNATION
    </div>

    <div class="yellow">
        GET READY TO<br>LEARN
    </div>

    <div class="green">
        START YOUR TECH<br>JOURNY
    </div>

</div>

<div class="pole"></div>

<h1>FULLSTACK EXPERTS ACADEMY</h1>

<p>Learn • Build • Grow 💡</p>

</body>
</html>
